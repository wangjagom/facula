<figure class="diagram demo stepper se11 gui2 g2-se93" data-step="0" data-max="4"><figcaption>SE93으로 T-code 만들기 · 내 REPORT 프로그램에</figcaption><div class="se-win"><div class="st-item " data-steps="0"><div class="se-title">Maintain Transaction</div></div><div class="st-item " data-steps="1"><div class="se-title">Create Transaction</div></div><div class="st-item " data-steps="2"><div class="se-title">Create Report Transaction <span class="mono">ZC05_EDU</span></div></div><div class="st-item " data-steps="3"><div class="se-title">Create Object Directory Entry</div></div><div class="st-item " data-steps="4"><div class="se-title">교육과정 조회</div></div><div class="st-item " data-steps="0"><div class="se-tool"><span class="se-tb"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><em>Change</em></span><span class="se-tb se-hl" data-steps="0"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg><em>Create</em></span></div><div class="se-body g2-form"><div class="se-frm"><span>Transaction Code</span><span class="se-in mono se-hl " data-steps="0">ZC05_EDU</span></div><p class="g2-cap">이름은 Z나 Y로 시작해요. 기존 T-code를 넣고 Display를 누르면 어떤 프로그램인지 볼 수 있어요</p></div></div><div class="st-item " data-steps="1"><div class="se-body g2-form"><div class="se-frm"><span>Short text</span><span class="se-in mono ">교육과정 조회</span></div><div class="se-grid se-gx" style="--cols:1fr"><div class="se-th"><span>Start object</span></div><div class="se-tr"><span class="mono">Program and screen (dialog transaction)</span></div><div class="se-tr se-hl" data-steps="1"><span class="mono">Program and selection screen (report transaction)</span></div><div class="se-tr"><span class="mono">Method of a class (OO transaction)</span></div><div class="se-tr"><span class="mono">Transaction with variant</span></div><div class="se-tr"><span class="mono">Transaction with parameters</span></div></div></div></div><div class="st-item " data-steps="2"><div class="se-tool"><span class="se-tb se-hl" data-steps="2"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><em>Save</em></span></div><div class="se-body g2-form"><div class="se-frm"><span>Program</span><span class="se-in mono se-hl " data-steps="2">ZC05_SELECT</span></div><div class="se-frm"><span>Selection screen</span><span class="se-in mono se-hl " data-steps="2">1000</span></div><div class="se-grid se-gx" style="--cols:1.6fr .5fr"><div class="se-th"><span>GUI support</span><span></span></div><div class="se-tr"><span class="mono">SAP GUI for HTML</span><span class="mono"></span></div><div class="se-tr"><span class="mono">SAP GUI for Java</span><span class="mono"></span></div><div class="se-tr se-hl" data-steps="2"><span class="mono">SAP GUI for Windows</span><span class="mono">✓</span></div></div></div></div><div class="st-item " data-steps="3"><div class="se-tool"><span class="se-tb"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><em>Save</em></span><span class="se-tb">Local Object</span></div><div class="se-body g2-form"><div class="se-frm"><span>Package</span><span class="se-in mono se-hl " data-steps="3">(수업 패키지)</span></div><p class="g2-cap">패키지로 저장하면 Transport Request 번호를 물어요. 연습용은 Local Object($TMP)</p></div></div><div class="st-item " data-steps="4"><div class="se-tool"><span class="se-in mono se-hl is-on" data-steps="4" style="min-width:150px">/nZC05_EDU</span></div><div class="se-body g2-form"><div class="se-frm"><span>교육과정</span><span class="se-in mono ">A001</span></div><p class="g2-cap">SE38을 거치지 않고 프로그램의 입력 화면(1000번)이 바로 열려요</p></div></div><div class="se-status"><span class="st-item" data-steps="3"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Transaction ZC05_EDU saved</span></div></div><div class="st-notes" aria-live="polite"><div class="st-note st-item se-note" data-steps="0"><b><i>1</i>SE93에서 새 이름을 적어요</b><span>SE93을 열고 Transaction Code에 ZC05_EDU를 적은 뒤 Create를 눌러요.</span></div><div class="st-note st-item se-note" data-steps="1"><b><i>2</i>종류를 골라요</b><span>Short text를 적고, PARAMETERS 입력 화면이 있는 REPORT 프로그램이니까 Program and selection screen (report transaction)을 골라요.</span></div><div class="st-note st-item se-note" data-steps="2"><b><i>3</i>실행할 프로그램을 적어요</b><span>Program에 프로그램 이름, Selection screen에 1000(PARAMETERS가 만든 기본 입력 화면)을 적어요. GUI support에서 SAP GUI for Windows에 체크하고 저장해요.</span></div><div class="st-note st-item se-note" data-steps="3"><b><i>4</i>저장할 곳을 정해요</b><span>테이블이나 프로그램처럼 Package와 Transport Request를 정해요.</span></div><div class="st-note st-item se-note" data-steps="4"><b><i>5</i>T-code로 실행해요</b><span>명령 입력칸에 /nZC05_EDU를 치면 프로그램의 입력 화면이 바로 열려요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
