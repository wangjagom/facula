<figure class="diagram demo stepper" data-step="0" data-max="4"><figcaption>async / await 코드가 실행되는 순서</figcaption><div class="st-grid"><pre class="st-code" aria-label="실행할 코드"><span class="st-line" data-steps="0"><span class="kd">function</span><span class="w"> </span><span class="nf">getScore</span><span class="p">()</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="0"><span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="ow">new</span><span class="w"> </span><span class="nb">Promise</span><span class="p">(</span><span class="nx">resolve</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="0"><span class="w">        </span><span class="nf">setTimeout</span><span class="p">(()</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="nf">resolve</span><span class="p">(</span><span class="mf">90</span><span class="p">),</span><span class="w"> </span><span class="mf">1000</span><span class="p">);</span></span><span class="st-line" data-steps="0"><span class="w">    </span><span class="p">});</span></span><span class="st-line" data-steps="0"><span class="p">}</span></span><span class="st-line" data-steps=""><span class="w"> </span></span><span class="st-line" data-steps="0"><span class="k">async</span><span class="w"> </span><span class="kd">function</span><span class="w"> </span><span class="nf">showScore</span><span class="p">()</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="2,4"><span class="w">    </span><span class="kd">const</span><span class="w"> </span><span class="nx">nScore</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="k">await</span><span class="w"> </span><span class="nf">getScore</span><span class="p">();</span></span><span class="st-line" data-steps="4"><span class="w">    </span><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="nx">nScore</span><span class="p">);</span></span><span class="st-line" data-steps="0"><span class="p">}</span></span><span class="st-line" data-steps="1"><span class="nf">showScore</span><span class="p">();</span></span><span class="st-line" data-steps="3"><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="s2">"이 줄이 먼저 찍혀요"</span><span class="p">);</span></span></pre><div class="st-side"><div class="st-box k-func"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-play-green-E"/></svg>showScore 함수</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0">아직 실행 전이에요</span><span class="st-item chip c-val" data-steps="1">실행을 시작했어요</span><span class="st-item chip c-wait" data-steps="2,3">await에서 멈춰 있어요</span><span class="st-item chip c-ok" data-steps="4">멈춘 자리에서 다시 이어져요</span></div></div><div class="st-box k-state"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-traffic-x-E"/></svg>getScore()의 Promise</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1">아직 없어요</span><span class="st-item chip c-wait" data-steps="2,3">기다리는 중 (pending) · 비어 있어요</span><span class="st-item chip c-ok" data-steps="4">성공 (fulfilled) · 상자 안에 90</span></div></div><div class="st-box k-console"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-console-ink-E"/></svg>콘솔</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1,2">아직 아무것도 없어요</span><span class="st-item chip c-out" data-steps="3"><span class="co-line">이 줄이 먼저 찍혀요</span></span><span class="st-item chip c-out" data-steps="4"><span class="co-line">이 줄이 먼저 찍혀요</span><span class="co-line">90</span></span></div></div></div></div><div class="st-notes" aria-live="polite"><p class="st-note st-item" data-steps="0">먼저 getScore와 showScore 함수를 만들어 두기만 해요. 함수는 부르기 전에는 실행되지 않아요.</p><p class="st-note st-item" data-steps="1">showScore()를 불러서 함수 안으로 들어가요.</p><p class="st-note st-item" data-steps="2">getScore()가 진동벨(Promise)을 돌려주고, await는 벨이 울릴 때까지 이 함수 안에서만 멈춰요.</p><p class="st-note st-item" data-steps="3">함수 안은 멈춰 있지만 바깥 코드는 기다리지 않고 계속 실행돼요. 그래서 이 줄이 먼저 찍혀요.</p><p class="st-note st-item" data-steps="4">1초 뒤 Promise가 성공해서 상자에 90이 들어오면, await가 90을 꺼내 nScore에 담고 멈췄던 자리부터 이어서 실행해요.</p></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
