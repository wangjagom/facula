<figure class="diagram demo stepper" data-step="0" data-max="5"><figcaption>for문이 한 바퀴씩 도는 순서</figcaption><div class="st-grid"><pre class="st-code" aria-label="실행할 코드"><span class="st-line" data-steps="1,3,4,5"><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kd">let</span><span class="w"> </span><span class="nx">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">0</span><span class="p">;</span><span class="w"> </span><span class="nx">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="mf">3</span><span class="p">;</span><span class="w"> </span><span class="nx">i</span><span class="o">++</span><span class="p">)</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="2,3,4"><span class="w">    </span><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="nx">i</span><span class="p">);</span></span><span class="st-line" data-steps=""><span class="p">}</span></span></pre><div class="st-side"><div class="st-box k-var"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-box-amber-E"/></svg>변수 i</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0">아직 만들기 전이에요</span><span class="st-item chip c-val" data-steps="1,2">0</span><span class="st-item chip c-val" data-steps="3">1</span><span class="st-item chip c-val" data-steps="4">2</span><span class="st-item chip c-val" data-steps="5">3</span></div></div><div class="st-box k-state"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-traffic-x-E"/></svg>조건 i &lt; 3</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1">아직 검사 전이에요</span><span class="st-item chip c-ok" data-steps="2">0 &lt; 3 → 참</span><span class="st-item chip c-ok" data-steps="3">1 &lt; 3 → 참</span><span class="st-item chip c-ok" data-steps="4">2 &lt; 3 → 참</span><span class="st-item chip c-no" data-steps="5">3 &lt; 3 → 거짓, 반복을 끝내요</span></div></div><div class="st-box k-console"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-console-ink-E"/></svg>콘솔</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1">아직 아무것도 없어요</span><span class="st-item chip c-out" data-steps="2"><span class="co-line">0</span></span><span class="st-item chip c-out" data-steps="3"><span class="co-line">0</span><span class="co-line">1</span></span><span class="st-item chip c-out" data-steps="4,5"><span class="co-line">0</span><span class="co-line">1</span><span class="co-line">2</span></span></div></div></div></div><div class="st-notes" aria-live="polite"><p class="st-note st-item" data-steps="0">for는 괄호 안 세 부분(시작, 조건, 한 바퀴 끝날 때마다)대로 움직여요. 아래로 스크롤하면 한 단계씩 진행되고, 위로 올리면 되돌아가요.</p><p class="st-note st-item" data-steps="1">시작: i를 0으로 만들어요. 이 부분은 처음에 딱 한 번만 실행돼요.</p><p class="st-note st-item" data-steps="2">조건 i &lt; 3이 참이라서 한 바퀴를 돌아요. console.log(0)이 실행돼요.</p><p class="st-note st-item" data-steps="3">한 바퀴가 끝나서 i++로 i가 1이 되고, 조건이 또 참이라서 console.log(1)이 실행돼요.</p><p class="st-note st-item" data-steps="4">i가 2가 돼도 아직 3보다 작아서 한 바퀴 더 돌아요. console.log(2)가 실행돼요.</p><p class="st-note st-item" data-steps="5">i++로 i가 3이 되면 조건이 거짓이라서 반복을 끝내요. 콘솔에는 0, 1, 2만 남아요.</p></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4,5"></i><i class="st-dot" data-steps="1,2,3,4,5"></i><i class="st-dot" data-steps="2,3,4,5"></i><i class="st-dot" data-steps="3,4,5"></i><i class="st-dot" data-steps="4,5"></i><i class="st-dot" data-steps="5"></i></div></div></figure>
