<figure class="diagram demo stepper" data-step="0" data-max="3"><figcaption>Promise 상자의 상태가 바뀌는 순서</figcaption><div class="st-grid"><pre class="st-code" aria-label="실행할 코드"><span class="st-line" data-steps="0"><span class="kd">function</span><span class="w"> </span><span class="nf">getScore</span><span class="p">()</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="0"><span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="ow">new</span><span class="w"> </span><span class="nb">Promise</span><span class="p">(</span><span class="nx">resolve</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="0"><span class="w">        </span><span class="nf">setTimeout</span><span class="p">(()</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="nf">resolve</span><span class="p">(</span><span class="mf">90</span><span class="p">),</span><span class="w"> </span><span class="mf">1000</span><span class="p">);</span></span><span class="st-line" data-steps="0"><span class="w">    </span><span class="p">});</span></span><span class="st-line" data-steps="0"><span class="p">}</span></span><span class="st-line" data-steps=""><span class="w"> </span></span><span class="st-line" data-steps="1"><span class="kd">const</span><span class="w"> </span><span class="nx">p</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nf">getScore</span><span class="p">();</span></span><span class="st-line" data-steps="2"><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="nx">p</span><span class="p">);</span></span><span class="st-line" data-steps="3"><span class="nf">setTimeout</span><span class="p">(()</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="nx">p</span><span class="p">),</span><span class="w"> </span><span class="mf">1500</span><span class="p">);</span></span></pre><div class="st-side"><div class="st-box k-var"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-box-amber-E"/></svg>변수 p</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0">아직 만들기 전이에요</span><span class="st-item chip c-val" data-steps="1,2,3">Promise 상자 (진동벨)</span></div></div><div class="st-box k-state"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-traffic-x-E"/></svg>Promise 상자 상태</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0">아직 없어요</span><span class="st-item chip c-wait" data-steps="1,2">기다리는 중 (pending) · 비어 있어요</span><span class="st-item chip c-ok" data-steps="3">성공 (fulfilled) · 상자 안에 90</span></div></div><div class="st-box k-console"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-console-ink-E"/></svg>콘솔</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1">아직 아무것도 없어요</span><span class="st-item chip c-out" data-steps="2"><span class="co-line">Promise {&lt;pending&gt;}</span></span><span class="st-item chip c-out" data-steps="3"><span class="co-line">Promise {&lt;pending&gt;}</span><span class="co-line">Promise {&lt;fulfilled&gt;: 90}</span></span></div></div></div></div><div class="st-notes" aria-live="polite"><p class="st-note st-item" data-steps="0">getScore()는 1초 걸려서 90을 알려 주는 함수예요. 결과가 아니라 진동벨(Promise)을 먼저 돌려줘요.</p><p class="st-note st-item" data-steps="1">p에는 90이 아니라 Promise 상자가 들어와요. 상자는 처음에 기다리는 중이고 비어 있어요.</p><p class="st-note st-item" data-steps="2">바로 찍으면 아직 기다리는 중(pending)이에요. 1초가 아직 지나지 않았기 때문이에요.</p><p class="st-note st-item" data-steps="3">1초가 지나 일이 끝나면 상자가 성공(fulfilled)으로 바뀌고 90이 들어와요. 이 상태는 다시 바뀌지 않아요.</p></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3"></i><i class="st-dot" data-steps="1,2,3"></i><i class="st-dot" data-steps="2,3"></i><i class="st-dot" data-steps="3"></i></div></div></figure>
