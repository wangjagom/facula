equest 하나에 담겨요. 택배 상자에 물건을 넣는 단계예요.</span></div><div class="st-note st-item" data-steps="1"><b><i>2</i>요청을 풀어서 테스트(QAS)로 보내요</b> <span>요청을 Release(내보내기)하면 같은 객체가 테스트 시스템에 들어가요. 개발 시스템의 원본은 그대로 남아요.</span></div><div class="st-note st-item" data-steps="2"><b><i>3</i>확인이 끝나면 운영(PRD)으로 보내요</b> <span>테스트에서 문제가 없으면 같은 요청을 운영 시스템에 넣어요. 실제 업무는 운영 시스템에서 해요.</span></div><div class="st-note st-item" data-steps="3"><b><i>4</i>$TMP로 저장한 객체는 떠나지 못해요</b> <span>Local Object($TMP)는 요청 번호가 없어서 개발 시스템에만 머물러요. 혼자 연습할 때만 써요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3"></i><i class="st-dot" data-steps="1,2,3"></i><i class="st-dot" data-steps="2,3"></i><i class="st-dot" data-steps="3"></i></div></div></figure>
