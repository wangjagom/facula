e-ck"></span><span class="mono">ZSNAME</span></div><div class="se-tr se-hl se-sel" data-steps="1,2"><span class="mono">CID</span><span class="se-ck"></span><span class="se-ck"></span><span class="mono">ZCID</span></div></div></div><div class="se-body st-item" data-steps="6"><div class="se-grid se-g5"><div class="se-th"><span>Field</span><span>Data element</span><span>Type</span><span>FK</span><span>Check table</span></div><div class="se-tr"><span class="mono">MANDT</span><span class="mono">MANDT</span><span class="mono">CLNT</span><span class="se-fk"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span class="mono">T000</span></div><div class="se-tr"><span class="mono">SID</span><span class="mono">ZSID</span><span class="mono">NUMC</span><span class="se-fk"></span><span class="mono"></span></div><div class="se-tr"><span class="mono">SNAME</span><span class="mono">ZSNAME</span><span class="mono">CHAR</span><span class="se-fk"></span><span class="mono"></span></div><div class="se-tr se-hl" data-steps="6"><span class="mono">CID</span><span class="mono">ZCID</span><span class="mono">CHAR</span><span class="se-fk"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span class="mono">ZCLASS</span></div></div></div><div class="se-status"><span class="st-item" data-steps="6"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Table ZSTUDENT was activated</span></div><div class="se-dim st-item" data-steps="3,4,5"></div><div class="se-pop st-item" data-steps="3,4,5" role="dialog" aria-label="외래키 만들기 창"><div class="se-pop-t">Create Foreign Key <span class="mono">ZSTUDENT-CID</span></div><div class="se-pop-b"><div class="se-frm"><span>Short text</span><span class="se-in">반 코드 체크</span></div><div class="se-frm"><span>Check table</span><span class="se-in se-hl mono" data-steps="3"><span class="st-item" data-steps="3,4,5">ZCLASS</span></span><span class="se-btn se-hl" data-steps="4">Generate proposal</span></div><div class="se-grid se-g4"><div class="se-th"><span>Check Table</span><span>ChkTablFld</span><span>For.key Table</span><span>Foreign Key Field</span></div><div class="se-pairs se-hl" data-steps="4"><div class="se-tr st-item" data-steps="4,5"><span class="mono">ZCLASS</span><span class="mono">MANDT</span><span class="mono">ZSTUDENT</span><span class="mono">MANDT</span></div><div class="se-tr st-item" data-steps="4,5"><span class="mono">ZCLASS</span><span class="mono">CID</span><span class="mono">ZSTUDENT</span><span class="mono">CID</span></div><div class="se-tr se-empty st-item" data-steps="3"><span>비어 있어요</span></div></div></div><div class="se-sem se-hl" data-steps="5"><div class="se-sem-h">Foreign key field type</div><span class="se-radio"><i class="se-dot"></i>Not specified</span><span class="se-radio"><i class="se-dot st-item" data-steps="5"></i>Non-key-fields/candidates</span><span class="se-radio"><i class="se-dot"></i>Key fields/candidates</span><span class="se-radio"><i class="se-dot"></i>Key fields of a text table</span><div class="se-card"><span>Cardinality</span><span class="se-in se-in-s mono"><span class="st-item" data-steps="5">1</span></span>:<span class="se-in se-in-s mono"><span class="st-item" data-steps="5">CN</span></span></div></div></div><div class="se-pop-f"><span class="se-btn se-ok se-hl" data-steps="5"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Copy</span><span class="se-btn"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Cancel</span></div></div></div><div class="st-notes" aria-live="polite"><div class="st-note st-item se-note" data-steps="0"><b><i>1</i>SE11에서 ZSTUDENT를 변경 모드로 열어요</b><span>SE11에 테이블 이름 ZSTUDENT를 적고 Change를 눌러요. Fields 탭이 보이면 준비 끝이에요. 아래로 스크롤하면 한 단계씩 진행돼요.</span></div><div class="st-note st-item se-note" data-steps="1"><b><i>2</i>외래키로 쓸 필드를 골라요</b><span>필드 목록에서 CID를 눌러 커서를 둬요. 외래키는 커서가 있는 필드에 걸려요.</span></div><div class="st-note st-item se-note" data-steps="2"><b><i>3</i>외래키 버튼을 눌러요</b><span>필드 목록 위에 있는 열쇠 모양 Foreign Keys 버튼을 눌러요.</span></div><div class="st-note st-item se-note" data-steps="3"><b><i>4</i>Check Table을 적어요</b><span>Create Foreign Key 창이 열려요. Check table 칸에 부모 테이블 ZCLASS를 적어요.</span></div><div class="st-note st-item se-note" data-steps="4"><b><i>5</i>제안 생성으로 필드 짝을 채워요</b><span>Generate proposal을 누르면 두 테이블의 필드 짝이 자동으로 채워져요. MANDT끼리, CID끼리 짝이 맞는지 확인해요.</span></div><div class="st-note st-item se-note" data-steps="5"><b><i>6</i>종류와 카디널리티를 고르고 복사해요</b><span>CID는 학생 테이블의 키가 아니니까 외래키 필드 종류는 Non-key-fields/candidates예요. 반 1개에 학생 여러 명이라 카디널리티는 1 : CN이에요. Copy(✓)를 누르면 창이 닫혀요.</span></div><div class="st-note st-item se-note" data-steps="6"><b><i>7</i>저장하고 활성화해요</b><span>저장(Ctrl+S)하고 활성화(Ctrl+F3)해요. Input Help/Check 탭에서 CID의 Check table 칸에 ZCLASS가 보이면 성공이에요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4,5,6"></i><i class="st-dot" data-steps="1,2,3,4,5,6"></i><i class="st-dot" data-steps="2,3,4,5,6"></i><i class="st-dot" data-steps="3,4,5,6"></i><i class="st-dot" data-steps="4,5,6"></i><i class="st-dot" data-steps="5,6"></i><i class="st-dot" data-steps="6"></i></div></div></figure>
