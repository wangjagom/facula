<figure class="diagram demo flexlab"><figcaption>정렬 값을 눌러서 안의 컨트롤이 어떻게 움직이는지 보세요</figcaption><div class="demo-row"><span class="demo-lab">컨트롤</span><div class="seg" data-k="dir"><button type="button" data-css="row" aria-pressed="true">HBox</button><button type="button" data-css="column" aria-pressed="false">VBox</button></div></div><div class="demo-row"><span class="demo-lab">justifyContent</span><div class="seg" data-k="j"><button type="button" data-css="flex-start" aria-pressed="true">Start</button><button type="button" data-css="center" aria-pressed="false">Center</button><button type="button" data-css="flex-end" aria-pressed="false">End</button><button type="button" data-css="space-between" aria-pressed="false">SpaceBetween</button><button type="button" data-css="space-around" aria-pressed="false">SpaceAround</button></div></div><div class="demo-row"><span class="demo-lab">alignItems</span><div class="seg" data-k="a"><button type="button" data-css="stretch" aria-pressed="true">Stretch</button><button type="button" data-css="flex-start" aria-pressed="false">Start</button><button type="button" data-css="center" aria-pressed="false">Center</button><button type="button" data-css="flex-end" aria-pressed="false">End</button><button type="button" data-css="baseline" aria-pressed="false">Baseline</button></div></div><div class="fl-stage" style="flex-direction:row;justify-content:flex-start;align-items:stretch"><div class="fl-item fl-1">Title</div><div class="fl-item fl-2">Input</div><div class="fl-item fl-3">Button</div></div><pre class="fl-code"><code>&lt;<span class="fl-tag">HBox</span> justifyContent="<span class="fl-j">Start</span>" alignItems="<span class="fl-a">Stretch</span>"&gt;</code></pre><p class="demo-hint">값이 저절로 바뀌어요. 직접 눌러 보면 멈추고, 누른 값대로 움직여요. VBox에서는 justifyContent가 세로, alignItems가 가로로 바뀌어요.</p></figure>
