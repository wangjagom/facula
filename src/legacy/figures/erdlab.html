<figure class="diagram demo erdlab" data-rel="1N"><figcaption>ERD 연습장: 학생, 반, 과목의 관계를 직접 그려 보세요</figcaption><p class="erd-mission"><b>미션</b> 학생은 한 반에 속해요. 학생은 여러 과목을 듣고, 과목 하나는 여러 학생이 들어요. 이 관계를 테이블 4개로 그려 보세요.</p><div class="erd-bar"><span class="erd-lbl">① 테이블 놓기</span><div class="seg erd-tables"><button type="button" class="erd-add" data-t="ZCLASS" aria-pressed="false">ZCLASS <small>반</small></button><button type="button" class="erd-add" data-t="ZSTUDENT" aria-pressed="false">ZSTUDENT <small>학생</small></button><button type="button" class="erd-add" data-t="ZENROLL" aria-pressed="false">ZENROLL <small>수강</small></button><button type="button" class="erd-add" data-t="ZSUBJECT" aria-pressed="false">ZSUBJECT <small>과목</small></button></div></div><div class="erd-bar"><span class="erd-lbl">② 관계 종류</span><div class="seg erd-rels" role="group" aria-label="관계 종류"><button type="button" data-rel="1N" aria-pressed="true">1:N</button><button type="button" data-rel="11" aria-pressed="false">1:1</button><button type="button" data-rel="NM" aria-pressed="false">N:M</button></div><span class="erd-tip">③ 테이블 두 개를 차례로 누르면 선이 그려져요</span></div><div class="erd-scroll"><svg class="erd-svg" viewBox="0 0 760 240" role="img" aria-label="ERD를 그리는 판"></svg></div><p class="erd-msg" aria-live="polite"></p><div class="erd-foot"><button type="button" class="dm-btn erd-check">정답 확인</button><button type="button" class="dm-btn erd-answer">정답 보기</button><button type="button" class="dm-btn erd-reset">모두 지우기</button></div><script type="application/json" class="erd-json">{"tables": {"ZCLASS": {"ko": "반", "f": [["CID", "키"], ["CNAME", ""]]}, "ZSTUDENT": {"ko": "학생", "f": [["SID", "키"], ["SNAME", ""], ["CID", "외래키"]]}, "ZENROLL": {"ko": "수강", "f": [["SID", "키·외래키"], ["SUBJ", "키·외래키"]]}, "ZSUBJECT": {"ko": "과목", "f": [["SUBJ", "키"], ["SUBJNAME", ""]]}}, "order": ["ZCLASS", "ZSTUDENT", "ZENROLL", "ZSUBJECT"], "expect": [["ZCLASS", "ZSTUDENT"], ["ZSTUDENT", "ZENROLL"], ["ZSUBJECT", "ZENROLL"]], "m": {"start": "위에서 테이블을 놓은 뒤, 테이블 두 개를 차례로 눌러 관계선을 그어 보세요. 1:N은 먼저 누른 테이블이 1쪽이에요. 테이블은 끌어서 옮길 수 있고, 선을 누르면 지워져요.", "pick": "{a} 테이블을 골랐어요. 이어서 연결할 테이블을 누르세요. 같은 테이블을 다시 누르면 취소돼요.", "made": "{a} - {b} 선을 그었어요. 아래 '정답 확인'을 눌러 보세요.", "same": "이미 같은 선이 있어요.", "ok": "{one} 1 : {many} N. 맞아요.", "rev": "{one} 1 : {many} N이 맞아요. 방향이 반대예요. 1쪽 테이블을 먼저 눌러서 다시 그려 보세요.", "kind": "{one} - {many} 관계 종류가 달라요. 한 {oko}에 {mko}이 여러 개이고, {mko} 한 명(건)은 {oko}이 하나예요.", "todo": "{one} - {many} 사이의 선을 아직 안 그렸어요.", "nm": "학생과 과목은 N:M이라 테이블 둘로는 이을 수 없어요. 가운데 연결 테이블(ZENROLL)을 두고, 학생 1 : 수강 N, 과목 1 : 수강 N 두 줄로 풀어 보세요.", "extra": "필요 없는 선이 있어요. 선을 눌러 지워 보세요.", "notable": "먼저 테이블을 놓으세요: {t}", "done": "완성했어요! 학생과 과목의 N:M을 연결 테이블(ZENROLL)로 풀어서, 모든 선이 1:N이 됐어요.", "answer": "정답이에요. 연결 테이블 ZENROLL을 가운데 둬서 선이 모두 1:N이 돼요.", "reset": "모두 지웠어요. 다시 그려 보세요."}}</script></figure>
