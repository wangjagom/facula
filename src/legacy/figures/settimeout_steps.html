<figure class="diagram demo stepper" data-step="0" data-max="4"><figcaption>setTimeout 코드가 실행되는 순서</figcaption><div class="st-grid"><pre class="st-code" aria-label="실행할 코드"><span class="st-line" data-steps="1"><span class="kd">let</span><span class="w"> </span><span class="nx">sResult</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">"아직 없음"</span><span class="p">;</span></span><span class="st-line" data-steps="2"><span class="nf">setTimeout</span><span class="p">(()</span><span class="w"> </span><span class="p">=&gt;</span><span class="w"> </span><span class="p">{</span></span><span class="st-line" data-steps="4"><span class="w">    </span><span class="nx">sResult</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="s2">"도착!"</span><span class="p">;</span></span><span class="st-line" data-steps="2"><span class="p">},</span><span class="w"> </span><span class="mf">1000</span><span class="p">);</span></span><span class="st-line" data-steps="3"><span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="nx">sResult</span><span class="p">);</span></span></pre><div class="st-side"><div class="st-box k-var"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-box-amber-E"/></svg>변수 sResult</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0">아직 만들기 전이에요</span><span class="st-item chip c-val" data-steps="1,2,3">&quot;아직 없음&quot;</span><span class="st-item chip c-val" data-steps="4">&quot;도착!&quot;</span></div></div><div class="st-box k-queue"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-hourglass-x-E"/></svg>대기실</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1">비어 있어요</span><span class="st-item chip c-wait" data-steps="2,3">콜백 함수 · 1초 뒤에 실행</span><span class="st-item chip c-empty" data-steps="4">비어 있어요 (방금 실행했어요)</span></div></div><div class="st-box k-console"><b class="st-h"><svg class="st-ic st-ic3" viewBox="0 0 64 64" aria-hidden="true"><use href="#nt-console-ink-E"/></svg>콘솔</b><div class="st-val"><span class="st-item chip c-empty" data-steps="0,1,2">아직 아무것도 없어요</span><span class="st-item chip c-out" data-steps="3,4"><span class="co-line">아직 없음</span></span></div></div></div></div><div class="st-notes" aria-live="polite"><p class="st-note st-item" data-steps="0">코드는 위에서 아래로 한 줄씩 실행돼요. 아래로 스크롤하면 한 단계씩 진행되고, 위로 올리면 되돌아가요.</p><p class="st-note st-item" data-steps="1">상자 sResult를 만들고 &quot;아직 없음&quot;을 넣어요.</p><p class="st-note st-item" data-steps="2">setTimeout은 함수를 대기실에 맡기고, 1초를 기다리지 않고 바로 다음 줄로 넘어가요.</p><p class="st-note st-item" data-steps="3">console.log가 바로 실행돼요. 대기실의 함수는 아직 실행 전이라서 sResult는 &quot;아직 없음&quot; 그대로예요.</p><p class="st-note st-item" data-steps="4">1초가 지나자 대기실의 함수가 실행돼서 sResult가 &quot;도착!&quot;으로 바뀌어요. 하지만 console.log는 이미 끝난 뒤라서 콘솔에는 &quot;아직 없음&quot;이 남아요.</p></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
