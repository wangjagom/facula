<span class="k">ENDFORM</span>.</pre></div><div class="st-item " data-steps="4"><div class="se-tool"><span class="se-tb"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><em>Save</em></span><span class="se-tb"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg><em>New Entries</em></span></div><div class="se-body"><div class="se-grid se-gx" style="--cols:.9fr 1fr .8fr .8fr"><div class="se-th"><span>CID</span><span>CNAME</span><span>FEE</span><span>WAERS</span></div><div class="se-tr"><span class="mono">CL301</span><span class="mono">ABAP반</span><span class="mono">370000</span><span class="mono">KRW</span></div><div class="se-tr se-hl" data-steps="4"><span class="mono">CL305</span><span class="mono">SAP반</span><span class="mono"></span><span class="mono"><b class='g2-kr'>KRW</b></span></div></div><p class="g2-cap">새 줄을 추가하자마자 WAERS 칸에 KRW가 들어가 있어요. 다른 통화로 바꿀 수도 있어요</p></div></div><div class="se-status"><span class="st-item" data-steps="3"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Object activated</span><span class="st-item" data-steps="4"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>새 줄에 기본값이 들어갔어요</span></div></div><div class="st-notes" aria-live="polite"><div class="st-note st-item se-note" data-steps="0"><b><i>1</i>SE11에서 TMG를 열어요</b><span>수강료 FEE(CURR)와 통화 WAERS(CUKY)가 있는 ZCLASS를 Change 모드로 열고, 메뉴 Utilities → Table Maintenance Generator를 눌러요.</span></div><div class="st-note st-item se-note" data-steps="1"><b><i>2</i>Events 화면으로 가요</b><span>TMG 화면이 이미 만들어져 있어야 해요. 메뉴 Environment → Modification → Events를 눌러요.</span></div><div class="st-note st-item se-note" data-steps="2"><b><i>3</i>이벤트 05를 등록해요</b><span>New Entries를 누르고 T 칸에 05(새 줄을 만들 때), FORM routine 칸에 SET_DEFAULT를 적어요. 옆의 편집 아이콘을 누르면 코드 창이 열려요.</span></div><div class="st-note st-item se-note" data-steps="3"><b><i>4</i>기본값을 넣는 코드를 적어요</b><span>FORM 안에 테이블이름-필드 = &#x27;KRW&#x27;.를 적어요. 여기서 zclass는 지금 만드는 새 줄 한 건이에요. 저장하고 활성화해요.</span></div><div class="st-note st-item se-note" data-steps="4"><b><i>5</i>SM30에서 확인해요</b><span>SM30으로 ZCLASS를 열고 New Entries를 누르면 WAERS 칸에 KRW가 미리 들어가 있어요. SE16으로 넣을 때는 이 이벤트가 동작하지 않아요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
