<figure class="diagram demo stepper se11 gui2 g2-start" data-step="0" data-max="4"><figcaption>SAP GUI 첫 화면 · 로그인부터 T-code까지</figcaption><div class="se-win"><div class="st-item " data-steps="0"><div class="se-title">SAP 로그인</div></div><div class="st-item " data-steps="1"><div class="se-title">SAP Easy Access</div></div><div class="st-item " data-steps="2"><div class="se-title">ABAP Editor: Initial Screen</div></div><div class="st-item " data-steps="3"><div class="se-title">Data Browser: Initial Screen<span class="se-badge">새 창 (세션 2)</span></div></div><div class="st-item " data-steps="4"><div class="se-title">System: Status</div></div><div class="st-item " data-steps="1,2,3"><div class="se-tool"><span class="se-in mono se-hl is-on" data-steps="1,2,3" style="min-width:150px"><span class="st-item " data-steps="1">SE11</span><span class="st-item " data-steps="2">/nSE38</span><span class="st-item " data-steps="3">/oSE16</span></span><span class="g2-cap" style="margin:0;align-self:center">← 명령 입력칸 (Enter)</span></div></div><div class="st-item " data-steps="0"><div class="se-body g2-form"><div class="se-frm"><span>Client</span><span class="se-in mono se-hl " data-steps="0">100</span></div><div class="se-frm"><span>User</span><span class="se-in mono ">RCODE-C-05</span></div><div class="se-frm"><span>Password</span><span class="se-in mono ">••••••••</span></div><div class="se-frm"><span>Language</span><span class="se-in mono ">EN</span></div><p class="g2-cap">Client는 데이터 칸막이 번호예요 (다음 섹션)</p></div></div><div class="st-item " data-steps="1"><div class="se-body"><div class="se-grid se-gx" style="--cols:1fr"><div class="se-th"><span>메뉴</span></div><div class="se-tr"><span class="mono">▸ Favorites (즐겨찾기)</span></div><div class="se-tr"><span class="mono">▸ SAP Menu</span></div></div><p class="g2-cap">T-code를 치고 Enter → 그 화면이 열려요. 자주 쓰는 T-code는 Favorites에 넣어 둬요</p></div></div><div class="st-item " data-steps="2"><div class="se-body g2-form"><div class="se-frm"><span>Program</span><span class="se-in mono ">ZC05_SELECT</span></div><p class="g2-cap">/n은 지금 하던 화면을 닫고 이동해요. 다른 T-code 화면 안에서도 바로 갈 수 있어요</p></div></div><div class="st-item " data-steps="3"><div class="se-body g2-form"><div class="se-frm"><span>Table Name</span><span class="se-in mono ">ZTC0503</span></div><p class="g2-cap">/o는 새 창(세션)을 열어요. 첫 번째 창의 SE38은 그대로 남아요</p></div></div><div class="st-item " data-steps="4"><div class="g2-menu"><span class="g2-mi">Menu</span><span class="g2-mi">Edit</span><span class="g2-mi g2-open">System<span class="g2-drop"><span>Create Session</span><span>End Session</span><span class="se-hl is-on" data-steps="4">Status...</span></span></span></div><div class="se-body g2-form" style="margin-top:124px"><div class="se-frm"><span>Client</span><span class="se-in mono ">100</span></div><div class="se-frm"><span>User</span><span class="se-in mono ">RCODE-C-05</span></div><div class="se-frm"><span>Language</span><span class="se-in mono ">EN</span></div><div class="se-frm"><span>Transaction</span><span class="se-in mono se-hl " data-steps="4">SE38</span></div><p class="g2-cap">지금 화면의 T-code와 프로그램 이름을 알려줘요</p></div></div></div><div class="st-notes" aria-live="polite"><div class="st-note st-item se-note" data-steps="0"><b><i>1</i>로그인해요</b><span>Client(수업은 100), User, Password, Language(EN)를 적고 Enter를 눌러요.</span></div><div class="st-note st-item se-note" data-steps="1"><b><i>2</i>명령 입력칸에 T-code를 쳐요</b><span>첫 화면 SAP Easy Access의 왼쪽 위 칸에 SE11처럼 T-code를 적고 Enter를 누르면 그 화면이 열려요.</span></div><div class="st-note st-item se-note" data-steps="2"><b><i>3</i>/n: 지금 창에서 바로 이동해요</b><span>다른 화면을 쓰는 중이면 그냥 SE38은 안 먹혀요. /nSE38처럼 앞에 /n을 붙이면 지금 화면을 끝내고 SE38로 가요.</span></div><div class="st-note st-item se-note" data-steps="3"><b><i>4</i>/o: 새 창을 열어요</b><span>/oSE16은 새 창(세션)에 SE16을 열어요. 테이블 구조(SE11)와 데이터(SE16)를 나란히 볼 때 편해요.</span></div><div class="st-note st-item se-note" data-steps="4"><b><i>5</i>System → Status로 지금 화면을 확인해요</b><span>메뉴 System → Status를 누르면 로그인한 Client, User, 지금 화면의 T-code와 프로그램 이름이 나와요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
