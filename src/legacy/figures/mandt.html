<figure class="diagram demo stepper se11 gui2 g2-mandt" data-step="0" data-max="4"><figcaption>MANDT는 어떻게 채워질까 · 로그인부터 저장까지</figcaption><div class="se-win"><div class="st-item " data-steps="0"><div class="se-title">SAP 로그인</div><div class="se-body g2-form"><div class="se-frm"><span>Client</span><span class="se-in mono se-hl " data-steps="0">100</span></div><div class="se-frm"><span>User</span><span class="se-in mono ">RCODE-C-05</span></div><div class="se-frm"><span>Password</span><span class="se-in mono ">••••••••</span></div><div class="se-frm"><span>Language</span><span class="se-in mono ">EN</span></div><p class="g2-cap">로그인한 Client 번호는 시스템 변수 <b class="mono">sy-mandt</b>에 들어가요</p></div></div><div class="st-item " data-steps="1,2"><div class="se-title">Dictionary: Display Table <span class="mono">ZCLASS</span></div><div class="se-tabs"><span class="se-tab">Attributes</span><span class="se-tab">Delivery and Maint.</span><span class="se-tab se-tab-on" data-steps="1">Fields</span><span class="se-tab se-tab-on" data-steps="2">Input Help/Check</span></div><div class="se-body"><div class="st-item " data-steps="1"><div class="se-grid se-gx" style="--cols:1.1fr .5fr .6fr 1.2fr"><div class="se-th"><span>Field</span><span>Key</span><span>Initial</span><span>Data element</span></div><div class="se-tr se-hl" data-steps="1"><span class="mono">MANDT</span><span class="mono">✓</span><span class="mono">✓</span><span class="mono">MANDT</span></div><div class="se-tr"><span class="mono">CID</span><span class="mono">✓</span><span class="mono">✓</span><span class="mono">ZCID</span></div><div class="se-tr"><span class="mono">CNAME</span><span class="mono"></span><span class="mono"></span><span class="mono">ZCNAME</span></div></div></div><div class="st-item " data-steps="2"><div class="se-grid se-gx" style="--cols:1fr 1fr .7fr 1fr"><div class="se-th"><span>Field</span><span>Data element</span><span>Type</span><span>Check table</span></div><div class="se-tr se-hl" data-steps="2"><span class="mono">MANDT</span><span class="mono">MANDT</span><span class="mono">CLNT</span><span class="mono">T000</span></div><div class="se-tr"><span class="mono">CID</span><span class="mono">ZCID</span><span class="mono">CHAR</span><span class="mono"></span></div><div class="se-tr"><span class="mono">CNAME</span><span class="mono">ZCNAME</span><span class="mono">CHAR</span><span class="mono"></span></div></div></div></div></div><div class="st-item " data-steps="3"><div class="se-title">Table ZCLASS Insert</div><div class="se-tool"><span class="se-tb"><svg class="se-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><em>Save</em></span></div><div class="se-body g2-form"><div class="se-frm"><span>CID</span><span class="se-in mono ">CL305</span></div><div class="se-frm"><span>CNAME</span><span class="se-in mono ">SAP반</span></div><p class="g2-cap g2-warn">MANDT 칸이 없어요. 저장하면 100이 자동으로 들어가요</p></div></div><div class="st-item " data-steps="4"><div class="se-title">Data Browser: Table ZCLASS · 3 Hits</div><div class="se-body"><div class="se-grid se-gx" style="--cols:.7fr 1fr 1.2fr"><div class="se-th"><span>MANDT</span><span>CID</span><span>CNAME</span></div><div class="se-tr"><span class="mono">100</span><span class="mono">CL301</span><span class="mono">ABAP반</span></div><div class="se-tr"><span class="mono">100</span><span class="mono">CL303</span><span class="mono">UI5반</span></div><div class="se-tr se-hl" data-steps="4"><span class="mono">100</span><span class="mono">CL305</span><span class="mono">SAP반</span></div></div><p class="g2-cap">200번 Client의 레코드는 같은 테이블에 있어도 보이지 않아요</p></div></div></div><div class="st-notes" aria-live="polite"><div class="st-note st-item se-note" data-steps="0"><b><i>1</i>로그인할 때 Client를 골라요</b><span>로그인 화면의 Client 칸에 적은 번호(100)가 이번 접속의 Client예요. SAP는 이 번호를 sy-mandt라는 시스템 변수에 기억해 둬요.</span></div><div class="st-note st-item se-note" data-steps="1"><b><i>2</i>테이블 맨 앞 키가 MANDT예요</b><span>SE11의 Fields 탭에서 MANDT가 첫 번째 키 필드예요. 이것 때문에 이 테이블은 Client마다 데이터가 따로 나뉘는 테이블이 돼요.</span></div><div class="st-note st-item se-note" data-steps="2"><b><i>3</i>MANDT는 CLNT 타입이고 T000을 검사해요</b><span>Input Help/Check 탭을 보면 MANDT의 타입은 CLNT(3자리), Check Table은 Client 목록 T000이에요. 개발자가 할 설정은 여기까지예요.</span></div><div class="st-note st-item se-note" data-steps="3"><b><i>4</i>입력 화면에는 MANDT 칸이 없어요</b><span>SE16이나 SM30에서 새 레코드를 넣을 때 MANDT는 묻지 않아요. 저장하는 순간 로그인한 Client 100이 자동으로 들어가요.</span></div><div class="st-note st-item se-note" data-steps="4"><b><i>5</i>조회하면 내 Client 데이터만 나와요</b><span>SE16으로 조회하면 MANDT가 100인 레코드만 보여요. ABAP의 SELECT도 같아서, WHERE에 MANDT를 안 적어도 로그인한 Client 조건이 자동으로 붙어요.</span></div></div><div class="st-foot"><div class="st-btns"><button type="button" class="dm-btn st-run"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>실행</button><button type="button" class="dm-btn st-pause"><svg class="bt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg><span class="t-pause">정지</span><span class="t-resume">이어서</span></button></div><div class="st-dots" aria-hidden="true"><i class="st-dot" data-steps="0,1,2,3,4"></i><i class="st-dot" data-steps="1,2,3,4"></i><i class="st-dot" data-steps="2,3,4"></i><i class="st-dot" data-steps="3,4"></i><i class="st-dot" data-steps="4"></i></div></div></figure>
