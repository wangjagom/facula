<figure class="diagram demo twolab" data-from="view"><figcaption>Input에 글자를 쳐 보세요. Text와 모델이 같이 바뀌어요</figcaption><div class="tw-grid"><div class="tw-box"><b>화면</b><label class="tw-row"><code>Input</code><input class="tw-input" type="text" value="SAPUI5" aria-label="Input 컨트롤의 값"></label><div class="tw-row"><code>Text</code><span class="tw-text">SAPUI5</span></div><p class="tw-xml mono">&lt;Input value="{/bookInfo/name}" /&gt;<br>&lt;Text text="{/bookInfo/name}" /&gt;</p></div><div class="tw-mid"><span class="tw-dir tw-d-view">화면 → 모델</span><span class="tw-dir tw-d-model">모델 → 화면</span></div><div class="tw-box"><b>모델 (JSONModel)</b><p class="tw-model mono">{ bookInfo: { name: "<span class="tw-val">SAPUI5</span>" } }</p><button type="button" class="dm-btn tw-set">setProperty("/bookInfo/name", "ABAP")</button></div></div></figure>
