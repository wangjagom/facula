name: Astro build check

# main 말고 다른 브랜치나 PR에서 Astro 빌드가 깨지지 않는지만 확인해요. 배포는 deploy.yml(main)이 해요.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist
          retention-days: 7
